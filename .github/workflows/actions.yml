name: Run GetArticles Daily

on:
  schedule:
    # Runs at 19:20 UTC (1:20 PM PST) every day
    - cron: '0 5 * * 1' 
  # Allows manual runs via the GitHub UI
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  run-get-articles-script:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run GetArticles script
        run: python GetArticles.py

      - name: Commit and push CSV changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add renovation_matches.csv
          git diff --staged --quiet || (git commit -m "Automated update of RSS CSV output" && git push)
